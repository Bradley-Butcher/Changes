[package]
name = "changes"
version = "0.3.0"
edition = "2024"
description = "See what your AI agent is doing to your code — live git diff viewer"
license = "MIT"
repository = "https://github.com/Bradley-Butcher/Changes"
keywords = ["git", "diff", "tui", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ratatui = { version = "0.30", features = ["crossterm", "underline-color"] }
crossterm = "0.29"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
notify-debouncer-mini = "0.7"
git2 = { version = "0.20", features = ["vendored-openssl"] }
syntect = "5"
similar = "2"
arboard = "3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
termimad = "0.34.1"
ansi-to-tui = "8.0.1"
unicode-width = "0.2"
unicode-segmentation = "1"
tree-sitter = "0.27.0"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
streaming-iterator = "0.1.9"

[[bench]]
name = "perf"
harness = false
